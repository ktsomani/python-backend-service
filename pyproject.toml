[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "task-service"
version = "1.0.0"
description = "Async FastAPI service with durable background report jobs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "redis>=5.2,<7", "celery[redis]>=5.5,<6",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3", "bcrypt>=4.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
