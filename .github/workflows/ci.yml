name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-not-for-production-123456789
      DATABASE_URL: postgresql+asyncpg://app:ci-password@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:ci-password@localhost:5432/app_test
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - name: Verify migrations and schema
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      - name: Container integration
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          printf 'JWT_SECRET=%s\nPOSTGRES_PASSWORD=%s\n' "$JWT_SECRET" "$POSTGRES_PASSWORD" > .env
          docker compose up --build -d --wait --wait-timeout 120
          python scripts/smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish commit-tagged image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Published $IMAGE" >> "$GITHUB_STEP_SUMMARY"
